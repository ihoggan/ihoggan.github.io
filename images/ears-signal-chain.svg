<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" font-family="DejaVu Sans, Arial, sans-serif">
<title>SDR receiver signal chain</title>
<rect width="1180" height="430" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<text x="600.0" y="34.0" font-size="20" text-anchor="middle" fill="#1f2933" font-weight="bold">nix6 SDR receiver: signal chain</text>
<text x="600.0" y="56.0" font-size="13" text-anchor="middle" fill="#5b6b7a" font-weight="normal">Antenna end (window) on the left, computer on the right. Not to scale.</text>
<line x1="95.0" y1="190.0" x2="40.0" y2="120.0" stroke="#5b6b7a" stroke-width="5"/>
<line x1="95.0" y1="190.0" x2="150.0" y2="120.0" stroke="#5b6b7a" stroke-width="5"/>
<circle cx="95" cy="190" r="5" fill="#1f2933"/>
<text x="95.0" y="96.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">V-dipole</text>
<text x="95.0" y="240.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">2 telescopic whips</text>
<text x="95.0" y="256.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">90°, arms ≈ 535 mm</text>
<line x1="95.0" y1="190.0" x2="300.0" y2="190.0" stroke="#1f2933" stroke-width="3"/>
<rect x="165" y="176" width="34" height="28" rx="4" fill="#2b2b2b" stroke="#1f2933" stroke-width="2"/>
<text x="182.0" y="166.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">ferrite</text>
<text x="236.0" y="216.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">coax ≈ 500 mm</text>
<text x="236.0" y="232.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">RG174-type, 50 Ω</text>
<rect x="300" y="172" width="40" height="36" rx="6" fill="#e5d9a8" stroke="#1f2933" stroke-width="2"/>
<text x="320.0" y="240.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">SMA</text>
<text x="320.0" y="256.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">male</text>
<rect x="345" y="170" width="90" height="40" rx="6" fill="#cfe3f5" stroke="#1f2933" stroke-width="2"/>
<text x="390.0" y="195.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">DC BLOCK</text>
<text x="390.0" y="240.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">SMA F/M</text>
<text x="390.0" y="256.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">stops bias-tee DC</text>
<rect x="440" y="160" width="170" height="60" rx="6" fill="#dfe4ea" stroke="#1f2933" stroke-width="2"/>
<text x="525.0" y="186.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">NESDR SMArTee XTR</text>
<text x="525.0" y="204.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">RTL2832U + E4000</text>
<text x="525.0" y="240.0" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="normal">always-on bias-tee</text>
<text x="525.0" y="256.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">≈ 52–2200 MHz</text>
<rect x="610" y="178" width="26" height="24" rx="2" fill="#bfc6cf" stroke="#1f2933" stroke-width="2"/>
<text x="623.0" y="218.0" font-size="11" text-anchor="middle" fill="#5b6b7a" font-weight="normal">USB-A</text>
<rect x="650" y="170" width="90" height="40" rx="6" fill="#e2f0e2" stroke="#1f2933" stroke-width="2"/>
<text x="695.0" y="187.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">hub chip</text>
<text x="695.0" y="202.0" font-size="11" text-anchor="middle" fill="#5b6b7a" font-weight="normal">1a40:0101</text>
<line x1="636.0" y1="190.0" x2="650.0" y2="190.0" stroke="#1f2933" stroke-width="3"/>
<line x1="740.0" y1="190.0" x2="960.0" y2="190.0" stroke="#1d4ed8" stroke-width="4"/>
<text x="850.0" y="176.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="normal">active USB 2.0 extender</text>
<text x="850.0" y="216.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">5000 mm (data + power)</text>
<rect x="960" y="145" width="180" height="90" rx="6" fill="#f3f4f6" stroke="#1f2933" stroke-width="2"/>
<text x="1050.0" y="177.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">nix6</text>
<text x="1050.0" y="197.0" font-size="12" text-anchor="middle" fill="#5b6b7a" font-weight="normal">rear USB 2.0 port</text>
<line x1="40.0" y1="300.0" x2="640.0" y2="300.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="340.0" y="322.0" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="bold">ON THE WINDOWSILL (by the antenna)</text>
<line x1="960.0" y1="300.0" x2="1140.0" y2="300.0" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1050.0" y="322.0" font-size="13" text-anchor="middle" fill="#5b6b7a" font-weight="bold">AT THE DESK</text>
<text x="40.0" y="360.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal">• Why this order: short coax at the antenna (≈0.5 dB loss), long USB run back to the PC.</text>
<text x="40.0" y="380.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal">• The DC block keeps the stick's always-on bias-tee voltage off the antenna and splice.</text>
<text x="40.0" y="400.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal">• Weak point: the USB joint at the stick. Support the stick flat and tie the cables back.</text>
</svg>
